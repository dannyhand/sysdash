# sysdash - server dashboard at https://<your-site>/dashboard/
# Proxies to the local backend on 127.0.0.1:8765 and asks for a password.
# Needs: a2enmod proxy proxy_http auth_basic authn_file

RedirectMatch ^/dashboard$ /dashboard/

<Location /dashboard/>
    ProxyPass        http://127.0.0.1:8765/
    ProxyPassReverse http://127.0.0.1:8765/

    AuthType Basic
    AuthName "Server dashboard"
    AuthUserFile /etc/apache2/sysdash.htpasswd
    Require valid-user

    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
</Location>
